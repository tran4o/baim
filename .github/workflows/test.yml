name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    env:
      BAIM_REQUIRE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify pinned Playwright and launch required Chromium
        run: |
          node <<'NODE'
          const expected = '1.61.1';
          const actual = require('playwright/package.json').version;
          const locked = require('./package-lock.json').packages['node_modules/playwright'].version;
          if (actual !== expected || locked !== expected) throw new Error('Playwright image/package version mismatch');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            console.log('Required Chromium launched:', browser.version());
            await browser.close();
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: npm test
      - name: Print saved image-decode diagnostics
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'target/tavern-cleanup-review/decode-diagnostics.json';
          if (fs.existsSync(file)) {
            console.log('Saved image-decode diagnostics:');
            console.log(JSON.stringify(JSON.parse(fs.readFileSync(file, 'utf8')), null, 2));
          } else {
            console.log('Image-decode diagnostics were not produced; inspect the original test failure.');
          }
          NODE
      - name: Verify generated animation metadata is current
        run: git diff --exit-code -- src/content/art/externalAnimationV1.generated.js
      - name: Verify animation catalog is current
        run: npm run check:animation-catalog
